name: Deploy to iqa (111.229.4.203)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o sg-scout-backend-linux .

      - name: Setup SSH (deploy key)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 111.229.4.203 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifacts
        run: |
          scp -i ~/.ssh/id_deploy -q sg-scout-backend-linux deploy/sg-scout-backend.service config.toml root@111.229.4.203:/tmp/
          ssh -i ~/.ssh/id_deploy root@111.229.4.203 'install -m 755 /tmp/sg-scout-backend-linux /opt/project/sg-scout/backend/sg-scout-backend && install -m 644 /tmp/sg-scout-backend.service /etc/systemd/system/sg-scout-backend.service && install -m 644 /tmp/config.toml /opt/project/sg-scout/backend/config.toml'

      - name: Restart & health check
        run: |
          ssh -i ~/.ssh/id_deploy root@111.229.4.203 'systemctl daemon-reload && systemctl restart sg-scout-backend && sleep 2 && curl -sf http://127.0.0.1:1324/common/health && echo && echo "DEPLOY_OK"'
